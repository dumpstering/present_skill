  /* Every look is a set of tokens on :root. The default (no data-theme, or "parks") is the
     1970s NASA manual / park service Unigrid look; the rest are fixed schemes. Local fonts
     only (CSP): each stack names the look's ideal font first, then something installed.
     page.js lists the theme ids. */
  :root {
    /* color */
    --bg: #f2e8d3; --panel: #faf4e4; --ink: #2a2018; --muted: #77664f; --rule: #d9cbac;
    --accent: #b8321a; --accent-soft: #f6dccb; --wait: #b8501a; --wait-soft: #f9e2c4;

    --stripe: linear-gradient(to right, var(--c1) 0 20%, var(--c2) 20% 40%, var(--c3) 40% 60%, var(--c4) 60% 80%, var(--c5) 80% 100%);
    --stripe-h: 8px;
    --mark: var(--c2); --quote: var(--c4); --edge: var(--c3); --badge: var(--c3); --badge-ink: #2a2018;
    --pill-wait: var(--c3); --focus: var(--c3);

    --sans: "Segoe UI", -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
    --display: "Helvetica Neue", Helvetica, "Arial Nova", Arial, sans-serif;
    --body-size: 17px; --body-weight: 400;
    --h-case: uppercase; --h-weight: 800; --h-glow: none;
    --h1-size: 40px; --h1-track: -0.025em; --h2-size: 23px; --h2-track: -0.005em;
    --h3-font: var(--display); --h3-size: 13.5px; --h3-weight: 700; --h3-case: uppercase; --h3-track: .09em; --h3-color: var(--accent);
    --ui-font: var(--display); --ui-case: uppercase; --ui-track: .08em; --ui-weight: 700;
    --pill-font: var(--display); --pill-size: 19px; --pill-weight: 800; --pill-track: -0.01em; --pill-case: uppercase;
    /* shape */
    --radius: 2px; --h2-rule: 4px solid var(--ink); --hr: 4px solid var(--ink);
    --card-top: 4px solid var(--ink); --card-shadow: none;

    :root:not([data-theme]), :root[data-theme="parks"] {

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--sans); }
  body { font-size: var(--body-size); font-weight: var(--body-weight); line-height: 1.6; -webkit-font-smoothing: antialiased; }
  [hidden] { display: none !important; }

  /* ---------- title band + stripe ---------- */
  header.top {
    position: sticky; top: 0; z-index: 5; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px;
    padding: 12px 24px calc(12px + var(--stripe-h)); background: var(--band); color: var(--band-muted);
    font-family: var(--ui-font); font-size: 12px; font-weight: var(--ui-weight); text-transform: var(--ui-case); letter-spacing: var(--ui-track);
  }
  header.top::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--stripe-h); background: var(--stripe); }
  .pill { font-family: var(--pill-font); font-size: var(--pill-size); font-weight: var(--pill-weight); letter-spacing: var(--pill-track);
    text-transform: var(--pill-case); color: var(--band-ink); }
  .waiting .pill { color: var(--pill-wait); }
  header.top .spacer { flex: 1; }
  header.top button, header.top select, .copy, .slidebar button {
    font-family: var(--ui-font); font-size: 11px; font-weight: var(--ui-weight); text-transform: var(--ui-case); letter-spacing: var(--ui-track);
    background: transparent; cursor: pointer; border-radius: var(--radius); padding: 4px 10px;
  }
  header.top button, header.top select { color: var(--band-muted); border: 1px solid var(--band-rule); }
  header.top button:hover:not(:disabled), header.top select:hover { color: var(--band-ink); border-color: var(--band-muted); }
  header.top select option { background: var(--band); color: var(--band-ink); text-transform: none; }
  .copy, .slidebar button { color: var(--muted); border: 1px solid var(--rule); }
  .copy:hover, .slidebar button:hover:not(:disabled) { color: var(--ink); border-color: var(--muted); }
  button:disabled { opacity: .4; cursor: default; }
  button:focus-visible, select:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }
  .count { font-variant-numeric: tabular-nums; }

  .banner {
    max-width: 880px; margin: 24px auto 0; padding: 12px 18px; border-left: 8px solid var(--mark); border-radius: var(--radius);
    background: var(--wait-soft); color: var(--wait);
    font-family: var(--ui-font); font-weight: 700; font-size: 14px; text-transform: var(--ui-case); letter-spacing: .06em;
  }
  .banner button { font: inherit; font-size: 12px; margin-left: 12px; color: inherit; background: transparent;
    border: 1px solid currentColor; border-radius: var(--radius); padding: 2px 10px; cursor: pointer; text-transform: inherit; }
  .empty { max-width: 880px; margin: 80px auto; padding: 0 24px; color: var(--muted); }

  /* ---------- document layout ---------- */
  .doc { display: grid; grid-template-columns: 1fr minmax(0, 880px) 1fr; gap: 0 32px; padding: 12px 24px 80px; }
  .doc article, .doc .options, .doc .slidebar { grid-column: 2; }
  .doc nav.outline { grid-column: 1; grid-row: 1 / span 3; justify-self: end; position: sticky; top: 84px;
    align-self: start; width: 220px; padding-top: 28px; display: none;
    font-family: var(--ui-font); font-size: 11.5px; font-weight: var(--ui-weight); text-transform: var(--ui-case); letter-spacing: .06em; }
  @media (min-width: 1280px) { .doc.has-outline nav.outline { display: block; } }
  nav.outline a { display: block; color: var(--muted); text-decoration: none; padding: 4px 0 4px 10px; border-left: 3px solid var(--rule); }
  nav.outline a.h3 { padding-left: 22px; font-weight: 400; }
  nav.outline a:hover { color: var(--ink); border-left-color: var(--mark); }

  article h1, article h2 { font-family: var(--display); font-weight: var(--h-weight); text-transform: var(--h-case); text-shadow: var(--h-glow); }
  article h1 { font-size: var(--h1-size); line-height: 1.05; letter-spacing: var(--h1-track); margin: 36px 0 14px; }
  article h2 { font-size: var(--h2-size); line-height: 1.2; letter-spacing: var(--h2-track); margin: 44px 0 12px;
    padding-top: 10px; border-top: var(--h2-rule); scroll-margin-top: 84px; }
  article h3 { font-family: var(--h3-font); font-size: var(--h3-size); font-weight: var(--h3-weight); text-transform: var(--h3-case);
    letter-spacing: var(--h3-track); color: var(--h3-color); margin: 28px 0 6px; scroll-margin-top: 84px; }
  article p, article li { max-width: 74ch; }
  article li::marker { color: var(--mark); font-weight: 700; }
  article a { color: var(--accent); text-underline-offset: 2px; }
  article strong { font-weight: 650; }
  article blockquote { margin: 16px 0; padding: 4px 16px; border-left: 4px solid var(--quote); color: var(--muted); }
  article hr { border: 0; border-top: var(--hr); margin: 32px 0; }
  article code { font-family: var(--mono); font-size: 0.86em; background: var(--code-bg); color: var(--code-ink); padding: 1px 5px; border-radius: var(--radius); }
  article pre, .opt pre { position: relative; background: var(--code-bg); color: var(--code-ink); padding: 14px 16px; border-radius: var(--radius);
    border-left: 4px solid var(--edge); overflow-x: auto; font-family: var(--mono); font-size: 13.5px; font-weight: 400; line-height: 1.5; }
  article pre code { background: none; padding: 0; font-size: inherit; }
  article pre .copy { position: absolute; top: 8px; right: 8px; opacity: 0; transition: opacity .15s; background: var(--panel); }
  article pre:hover .copy, article pre .copy:focus-visible { opacity: 1; }
  article table { display: block; overflow-x: auto; border-collapse: collapse; margin: 18px 0; font-size: 0.86em; }
  article th, article td { border-bottom: 1px solid var(--rule); padding: 7px 16px 7px 0; text-align: left; vertical-align: top; }
  article th { font-family: var(--ui-font); font-weight: 700; color: var(--ink); font-size: 11.5px; text-transform: uppercase;
    letter-spacing: .08em; border-bottom: 2px solid var(--ink); }
  article tbody tr:hover { background: var(--panel); }
  .img-ref { color: var(--muted); font-style: italic; }

  /* ---------- options (AskUserQuestion) ---------- */
  .options h3 { font-family: var(--h3-font); font-size: 12px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .09em; color: var(--h3-color); margin: 28px 0 8px; }
  .opt { display: grid; grid-template-columns: 38px 1fr auto; gap: 4px 12px; align-items: start;
    background: var(--panel); border: 1px solid var(--rule); border-top: var(--card-top); border-radius: var(--radius);
    box-shadow: var(--card-shadow); padding: 12px 14px; margin: 12px 0; }
  .optgroup { margin: 14px 0 8px; font-size: var(--body-size); }
  .opt .n { width: 30px; height: 30px; border-radius: 50%; background: var(--badge); color: var(--badge-ink);
    font-family: var(--display); font-weight: 800; font-size: 15px; display: flex; align-items: center; justify-content: center; }
  .opt .label { font-family: var(--display); font-weight: var(--h-weight); }
  .opt .desc { grid-column: 2 / span 2; color: var(--muted); font-size: 0.9em; }
  .opt pre { grid-column: 2 / span 2; margin: 6px 0 0; white-space: pre-wrap; }

  /* ---------- slides ---------- */
  .slides article { min-height: calc(100vh - 240px); display: flex; flex-direction: column; justify-content: center; font-size: 1.18em; }
  .slides article > section { display: none; }
  .slides article > section.on { display: block; }
  .slides article h2 { font-size: calc(var(--h2-size) * 2); line-height: 1.02; padding-top: 16px; margin-top: 0; }
  .slides article > section.on { animation: fade .18s ease-out; }
  .slides article > section.lead > p { font-size: 1.35em; line-height: 1.4; }
  .slides .agenda { color: var(--muted); border-top: var(--h2-rule); margin-top: 28px; padding-top: 18px; }
  .slides .agenda li { max-width: none; }
  .slides nav.outline { display: none !important; }
  .slidebar { display: flex; align-items: center; gap: 14px; padding-top: 16px;
    font-family: var(--ui-font); font-size: 12px; font-weight: var(--ui-weight); letter-spacing: .08em; color: var(--muted); }
  .slidebar .bar { flex: 1; height: 3px; background: var(--rule); border-radius: var(--radius); overflow: hidden; }
  .slidebar .bar i { display: block; height: 100%; width: 0; background: var(--mark); transition: width .2s; }
  .slidebar .keys { text-transform: var(--ui-case); font-size: 11px; }
  @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .slides article > section.on { animation: none; } .slidebar .bar i { transition: none; } }

  @media print {
    header.top, nav.outline, .copy, .slidebar { display: none !important; }
    .slides article > section { display: block; }
  }
</style>
</head>
<body>
<header class="top">
  <span class="pill" id="pill">Loading</span>
  <span id="meta"></span>
  <span class="spacer"></span>
  <select id="theme" aria-label="Page style" title="Page style"></select>
  <button id="older" title="Earlier page in this session">Older</button>
  <span class="count" id="count"></span>
  <button id="newer" title="Later page in this session">Newer</button>
  <button id="view" hidden>Slides</button>
  <button id="copy-all">Copy markdown</button>
</header>
<div class="banner" id="banner" hidden>Claude is waiting on you. Answer in the chat; this page is a mirror.</div>
<main class="doc" id="doc">
  <nav class="outline" id="outline" aria-label="Sections"></nav>
  <article id="article"><p class="empty">Waiting for the first page. If this stays empty, the feed file next to this page could not be read.</p></article>
  <div class="options" id="options"></div>
  <div class="slidebar" id="slidebar" hidden>
    <button id="prev">Back</button><span class="count" id="slidecount"></span>
    <div class="bar"><i id="prog"></i></div>
    <span class="keys">Arrows or space move / D for document</span>
    <button id="next">Next</button>
  </div>
</main>
<script src="{{MARKED_SRC}}"></script>
<script src="{{PAGE_SRC}}" data-feed="{{FEED}}" data-build="{{BUILD}}"></script>
</body>
</html>
